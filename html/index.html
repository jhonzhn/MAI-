<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <title>Un jardín para ti · inicio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/inicio.css">
  <script src="../js/inicio.js" defer></script>

<body class="scene-1 flower-cover">
  <div class="night-sky" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div id="petals" aria-hidden="true"></div>
  <audio id="music" loop preload="none"><source src="../music.mp3" type="audio/mpeg"></audio>
  <main>
<section class="page active flower-intro" id="page1">
      <div class="intro-only" aria-label="Una flor abierta. Tócala para continuar.">
        <button class="opening-flower" id="openingFlower" aria-label="Tocar la flor para dejar caer sus pétalos" aria-pressed="false">
          <span class="flower-aura"></span>
          <span class="petal-piece petal-top"></span>
          <span class="petal-piece petal-upper-right"></span>
          <span class="petal-piece petal-right-mid"></span>
          <span class="petal-piece petal-lower-right"></span>
          <span class="petal-piece petal-lower-left-mid"></span>
          <span class="petal-piece petal-bottom"></span>
          <span class="petal-piece petal-lower-left"></span>
          <span class="petal-piece petal-upper-left"></span>
          <span class="flower-heart"><i></i></span>
        </button>
      </div>
    </section>
  </main>
  <div class="garden-floor" id="gardenFloor" aria-hidden="true"></div>
